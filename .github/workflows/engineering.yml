name: SDLC engineering
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdlc-engineering-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact product and upstream sources
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/sdlc-source/upstream" "$RUNNER_TEMP/sdlc-source/baselines" "$RUNNER_TEMP/sdlc-source/logs"
          cd "$RUNNER_TEMP/sdlc-source/upstream"
          git init .
          git remote add origin https://github.com/github/spec-kit.git
          git fetch --depth=1 origin a4e25ce6b96dc8e85f84206c6a54353fa9c5260b
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = a4e25ce6b96dc8e85f84206c6a54353fa9c5260b
      - name: Install pinned upstream and initialize three empty projects
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sdlc-upstream-env"
          "$RUNNER_TEMP/sdlc-upstream-env/bin/python" -m pip install -r tools/requirements.txt "$RUNNER_TEMP/sdlc-source/upstream" > "$RUNNER_TEMP/sdlc-source/logs/install.log" 2>&1
          "$RUNNER_TEMP/sdlc-upstream-env/bin/python" -m pip freeze > "$RUNNER_TEMP/sdlc-source/logs/pip-freeze.txt"
          "$RUNNER_TEMP/sdlc-upstream-env/bin/specify" version > "$RUNNER_TEMP/sdlc-source/logs/version.log" 2>&1
          for agent in codex claude cursor-agent; do
            mkdir -p "$RUNNER_TEMP/sdlc-source/baselines/$agent"
            (cd "$RUNNER_TEMP/sdlc-source/baselines/$agent" && "$RUNNER_TEMP/sdlc-upstream-env/bin/specify" init . --integration "$agent" --script sh --ignore-agent-tools --non-interactive --integration-options="--events=false") > "$RUNNER_TEMP/sdlc-source/logs/init-$agent.log" 2>&1
          done
          python3 - <<'PY'
          import json, os, pathlib, hashlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'sdlc-source'
          records = {}
          for f in sorted((root/'baselines').rglob('*')):
              if f.is_file():
                  records[str(f.relative_to(root))] = hashlib.sha256(f.read_bytes()).hexdigest()
          (root/'baseline-manifest.json').write_text(json.dumps({'upstream_sha':'a4e25ce6b96dc8e85f84206c6a54353fa9c5260b','source_sha':os.environ['GITHUB_SHA'],'files':records}, indent=2)+'\n')
          print('UPSTREAM INSTALL AND THREE EMPTY INITIALIZATIONS: PASS')
          print('Collected files:', len(records))
          PY
      - name: Verify committed product without rewriting generated packages
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/verify.py
          "$RUNNER_TEMP/sdlc-upstream-env/bin/python" -B tools/verify.py --upstream "$RUNNER_TEMP/sdlc-source/upstream" --baselines "$RUNNER_TEMP/sdlc-source/baselines" --evidence "$RUNNER_TEMP/sdlc-source/verification"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Package exact source and engineering evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdlc-export" "$RUNNER_TEMP/sdlc-source"
          tar --exclude=.git -czf "$RUNNER_TEMP/sdlc-export/source-and-baselines.tar.gz" -C "$RUNNER_TEMP/sdlc-source" .
          git archive HEAD | gzip > "$RUNNER_TEMP/sdlc-export/product-source.tar.gz"
      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdlc-engineering-${{ github.sha }}
          path: ${{ runner.temp }}/sdlc-export/
          retention-days: 7
          if-no-files-found: error
