name: confirmation-hints-once
on:
  push:
    branches: [fix/realflow-closure-v1]
    paths: [.github/workflows/confirmation-hints-once.yml]
permissions:
  contents: write
jobs:
  apply-reviewed:
    if: github.repository == 'ousui/sdlc-ai-spec' && github.ref == 'refs/heads/fix/realflow-closure-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only digest-bound bytes, then remove this transport
        env:
          PATCH_DATA: 
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8fee94d1341814b486fc544295868b24068a3ac6 HEAD
          mkdir -p "$RUNNER_TEMP/hint-evidence"
          python3 - <<'PY'
          import os, base64, zlib, hashlib, subprocess
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(os.environ['PATCH_DATA'],validate=True))
          assert hashlib.sha256(raw).hexdigest()=='5ba25ffd9e5ad02a2cbb75a23155d1518fac4d881613e52a2b15b67eeb2d80b1'
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','-'],input=raw,check=True)
          (Path(os.environ['RUNNER_TEMP'])/'hint-evidence/reviewed.patch').write_bytes(raw)
          Path('.github/workflows/confirmation-hints-once.yml').unlink()
          PY
          python3 -B -m unittest tests.skill_dsn.test_confirmation_bindings tests.skill_pln.test_confirmation_bindings -v 2>&1 | tee "$RUNNER_TEMP/hint-evidence/targeted.log"
          git add packages/sdlc_phasekit/handler.py skills/sdlc-200-dsn/scripts/dsn_handler.py skills/sdlc-status/references/source-lock.json tests/skill_dsn/test_confirmation_bindings.py tests/skill_pln/test_confirmation_bindings.py .github/workflows/confirmation-hints-once.yml
          git diff --cached --check
          test "$(git write-tree)" = 15a8a418686cbf49f454f4f31f9bc5d9124f3af9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): expose persisted DSN and PLN confirmation subject bindings'
          git rev-parse HEAD > "$RUNNER_TEMP/hint-evidence/source.sha"
          git bundle create "$RUNNER_TEMP/hint-evidence/source.bundle" HEAD
          test "$(git ls-remote origin refs/heads/fix/realflow-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/realflow-closure-v1
      - name: Verify exact committed source without modifying it
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/validate.py --profile full --source-sha "$(git rev-parse HEAD)" --json-out "$RUNNER_TEMP/hint-evidence/full.json" 2>&1 | tee "$RUNNER_TEMP/hint-evidence/full.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirmation-hints-${{ github.sha }}
          path: ${{ runner.temp }}/hint-evidence/
          if-no-files-found: error
          retention-days: 30
