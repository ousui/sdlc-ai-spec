name: build-remaining-phases-v19

on:
  push:
    branches:
      - internal/remaining-phases-v19
    paths:
      - .github/workflows/build-remaining-phases-v19.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: build-remaining-phases-v19
  cancel-in-progress: true

jobs:
  build-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: default
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect immutable recovery materials
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          materials=/tmp/remaining-phases-v19-materials
          rm -rf "$materials"
          mkdir -p "$materials/actions/quarantine" "$materials/actions/patch-tail" "$materials/refs"

          gh run download 33587166202 \
            --repo "$GITHUB_REPOSITORY" \
            --name quarantine-v16-snapshot \
            --dir "$materials/actions/quarantine"
          gh run download 33573635143 \
            --repo "$GITHUB_REPOSITORY" \
            --name patch-tail-snapshot-v2 \
            --dir "$materials/actions/patch-tail"

          refs=(
            origin/internal/quarantine-remaining-phases-v16-failed
            origin/feature/complete-remaining-phases
            origin/internal/patch-tail-snapshot-v2
            origin/internal/imp-base-snapshot-20260902
          )
          if git show-ref --verify --quiet refs/remotes/origin/internal/local-candidate-imp-v1; then
            refs+=(origin/internal/local-candidate-imp-v1)
          fi
          for ref in "${refs[@]}"; do
            safe="${ref#origin/}"
            safe="${safe//\//__}"
            git archive --format=zip --output="$materials/refs/$safe.zip" "$ref"
          done

      - name: Expand every nested ZIP into the searchable material tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          root = Path('/tmp/remaining-phases-v19-materials')
          expanded = root / 'expanded'
          expanded.mkdir(parents=True, exist_ok=True)
          seen: set[str] = set()
          for round_number in range(12):
              archives = [p for p in root.rglob('*.zip') if p.is_file()]
              pending = []
              for archive in archives:
                  digest = hashlib.sha256(archive.read_bytes()).hexdigest()
                  if digest not in seen:
                      pending.append((archive, digest))
              if not pending:
                  break
              for index, (archive, digest) in enumerate(pending):
                  seen.add(digest)
                  destination = expanded / f'r{round_number:02d}-{index:04d}-{digest[:12]}'
                  destination.mkdir(parents=True, exist_ok=True)
                  try:
                      with zipfile.ZipFile(archive) as handle:
                          handle.extractall(destination)
                  except Exception:
                      continue
          (root / 'expanded-manifest.txt').write_text(
              '\n'.join(sorted(seen)) + '\n', encoding='utf-8'
          )
          PY

          find /tmp/remaining-phases-v19-materials -type f -print -exec sha256sum {} \; | sort \
            > /tmp/remaining-phases-v19-materials.sha256

      - name: Recover a complete IMP-capable source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/internal_recover_source_v18.py \
            /tmp/remaining-phases-v19-materials \
            /tmp/remaining-phases-v19-recovered-source

      - name: Build all four exact candidate refs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/internal_build_remaining_phases_v18.py \
            /tmp/remaining-phases-v19-recovered-source \
            /tmp/remaining-phases-v19-result.json

      - name: Upload recovery and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-phases-v19-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/remaining-phases-v19-result.json
            /tmp/recovery-report.json
            /tmp/remaining-phases-v19-materials.sha256
            /tmp/remaining-phases-v18-work/real-project-validation-repeat.json
