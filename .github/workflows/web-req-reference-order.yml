name: web-req-reference-order
on:
  push:
    branches: [verify/web-realflow-v1]
    paths: [.github/workflows/web-req-reference-order.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'ousui/sdlc-ai-spec' && github.ref == 'refs/heads/verify/web-realflow-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/web-realflow-v1
          fetch-depth: 0
      - name: Apply exact REQ reference-order repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('skills/sdlc-100-req/scripts/runtime.py');s=p.read_text()
          old='f"{root}{name}@sha256:{digest}" for name, digest in SPEC_HASHES.items()'
          assert s.count(old)==1, 'Source drift'
          p.write_text(s.replace(old,'f"{root}{name}@sha256:{digest}" for name, digest in sorted(SPEC_HASHES.items())'))
          p=Path('skills/sdlc-100-req/scripts/req_semantics.py');s=p.read_text()
          anchor='    accepted = parse_reference_set(confirmation["Accepted Exception References"])'
          assert s.count(anchor)==1, 'Source drift'
          addition='\n'.join([
          '    for record in (confirmation, summary):',
          '        value = record["Evaluation Contract Set"]',
          '        sources = parse_reference_set(value)',
          '        if not sources or value != ", ".join(sorted(sources)):',
          '            raise RequirementSemanticError("Evaluation Contract Set must use sorted canonical references")',
          '    if confirmation["Evaluation Contract Set"] != summary["Evaluation Contract Set"]:',
          '        raise RequirementSemanticError("Confirmation and Gate use different Evaluation Contract Sets")', ''])
          p.write_text(s.replace(anchor,addition+anchor))
          Path('tests/skill_req/test_evaluation_order.py').write_text('''"""WEB-RF-003: externally enforce the Spec reference-set order."""
          import unittest
          from tests.skill_req.support import (RequirementFixture, runtime,
              RequirementSemanticError, validate_persisted_requirement, parse_canonical_artifact)

          class EvaluationOrderTests(RequirementFixture, unittest.TestCase):
              def payload(self):
                  r=runtime.execute_phase(self.handler, self.request(final=False))
                  self.assertIsNotNone(r['artifact'],r)
                  a=r['artifact']
                  return self.store.read_revision(a['id'],a['revision']).payload.primary_blob
              def test_generated_set_has_sorted_unique_exact_sources(self):
                  raw=self.payload()
                  value=runtime.base._evaluation_contract_set()
                  items=value.split(', ')
                  self.assertEqual(items,sorted(set(items)))
                  self.assertEqual(len(items),3)
                  self.assertIn(value.encode(),raw)
                  validate_persisted_requirement(parse_canonical_artifact(raw))
              def test_reordered_set_is_rejected(self):
                  raw=self.payload();old=runtime.base._evaluation_contract_set()
                  new=', '.join(reversed(old.split(', ')))
                  self.assertNotEqual(old,new)
                  with self.assertRaises(RequirementSemanticError):
                      validate_persisted_requirement(parse_canonical_artifact(raw.replace(old.encode(),new.encode())))
              def test_noncanonical_separator_is_rejected(self):
                  raw=self.payload();old=runtime.base._evaluation_contract_set()
                  with self.assertRaises(RequirementSemanticError):
                      validate_persisted_requirement(parse_canonical_artifact(raw.replace(old.encode(),old.replace(', ', ',').encode())))
          ''')
          PY
      - name: Targeted regression and exact commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/req-evidence"
          python3 -B -m unittest tests.skill_req.test_evaluation_order tests.skill_req.test_review_fixes tests.skill_req.test_runtime -v 2>&1 | tee "$RUNNER_TEMP/req-evidence/targeted.log"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/sdlc-100-req/scripts/runtime.py skills/sdlc-100-req/scripts/req_semantics.py tests/skill_req/test_evaluation_order.py
          git commit -m 'fix(req): canonicalize and validate evaluation reference ordering'
          git rev-parse HEAD > "$RUNNER_TEMP/req-evidence/source.sha"
          git diff HEAD^ HEAD > "$RUNNER_TEMP/req-evidence/repair.patch"
      - name: Full exact-source regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/validate.py --profile full --source-sha "$(git rev-parse HEAD)" --json-out "$RUNNER_TEMP/req-evidence/full.json" 2>&1 | tee "$RUNNER_TEMP/req-evidence/full.log"
      - name: Preserve exact source and push authorized repair branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verify/web-realflow-v1
          test -z "$(git status --porcelain)"
          git bundle create "$RUNNER_TEMP/req-evidence/source.bundle" HEAD
          git push origin HEAD:refs/heads/verify/web-realflow-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: req-reference-order-${{ github.sha }}
          path: ${{ runner.temp }}/req-evidence/
          if-no-files-found: error
          retention-days: 30
