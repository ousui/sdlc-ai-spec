name: native-budget-once
on:
  push:
    branches: [fix/realflow-closure-v1]
    paths: [.github/workflows/native-budget-once.yml]
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/realflow-closure-v1
          test "$(git rev-parse HEAD^)" = 5b7572bc6720357e786eece4958ab345f27c5d94
          python3 - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          p=Path('skills/sdlc-500-vfy/scripts/vfy_executor.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='17e33180d51bed75b24786cd44a5c125ccf331b4f3a0f961d4a5c23504489c62'
          s=p.read_text()
          new='def _inherited_resource_cap(kind: int, budget: int) -> int:\n    """Apply a finite budget without raising inherited soft or hard limits."""\n    inherited = resource.getrlimit(kind)\n    return min([budget, *(v for v in inherited if v != resource.RLIM_INFINITY)])\n\n\ndef _bounded_process(\n'
          s=s.replace('def _bounded_process(\n',new,1)
          s=s.replace('resource.setrlimit(resource.RLIMIT_NOFILE, (64, 64))','nofile = _inherited_resource_cap(resource.RLIMIT_NOFILE, 1024)\n        resource.setrlimit(resource.RLIMIT_NOFILE, (nofile, nofile))',1)
          s=s.replace('    environment = {\n','    scratch = root / ".tmp"\n    scratch.mkdir(exist_ok=True)\n    require(not any(c in str(scratch) for c in (\'"\', "\\n", "\\r")),\n            "VFY_METHOD_NOT_READY", "Scratch path cannot be represented as one JVM option")\n    environment = {\n',1)
          s=s.replace('        "TMPDIR": str(root / ".tmp"),','        "TMPDIR": str(scratch),\n        # JVMs do not derive java.io.tmpdir from TMPDIR. This runtime-owned value\n        # replaces (never concatenates) untrusted caller Java option variables.\n        "JAVA_TOOL_OPTIONS": \'-Djava.io.tmpdir="\' + str(scratch) + \'"\',',1)
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='1e1c57d2685843ba6888f8b409d9b5738256306c60cb2269c873eae02605d595'
          p=Path('skills/sdlc-400-imp/scripts/imp_executor.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='325ea30a42d7cb90cd7f84d807a6e97b161a338fbb9b78df7d0cd5a139e66d61'
          s=p.read_text()
          s=s.replace('    return {\n        "PATH": os.environ.get("PATH", ""),','    require(not any(c in str(scratch) for c in (\'"\', "\\n", "\\r")),\n            "IMP_READINESS_FAILED", "Scratch path cannot be represented as one JVM option")\n    return {\n        "PATH": os.environ.get("PATH", ""),',1)
          s=s.replace('        "TMPDIR": str(scratch),','        "TMPDIR": str(scratch),\n        "JAVA_TOOL_OPTIONS": \'-Djava.io.tmpdir="\' + str(scratch) + \'"\',',1)
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='94ad77bbe9c78e834d99933e89609d0b09fd68a8cf6bdd54280415575a5a90c7'
          assert hashlib.sha256(Path('tests/skill_vfy/test_native_resource_budget.py').read_bytes()).hexdigest()=='22f142f5ce808e72bdebeaa5ad8db818939d13d002293bb08f5da52cd7ece342'
          assert hashlib.sha256(Path('tests/skill_imp/test_jvm_scratch.py').read_bytes()).hexdigest()=='202780fcfcbe1175e18b5e9b276ccde29310fe00f3817d69a73cd8c2e4382118'
          Path('.github/workflows/native-budget-once.yml').unlink()
          subprocess.run(['git','add','-u'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='b11a8996f123c080154f66673384f6e797cc0595'
          PY
      - name: Commit immutable candidate
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/realflow-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(execution): bound compiler file handles and own JVM scratch paths' -m 'Respect inherited limits and isolate temp output; preserve network/output/timeout controls. Refs ousui/test-sdlc#17.'
          git push origin HEAD:refs/heads/fix/realflow-closure-v1
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: materialize
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare containment and preserve exact provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/budget-tools" "$RUNNER_TEMP/budget-evidence"
          if ! command -v bwrap >/dev/null; then
            cd "$RUNNER_TEMP/budget-tools"
            apt-get download bubblewrap
            for p in bubblewrap_*.deb; do dpkg-deb -x "$p" extracted; done
            echo "$PWD/extracted/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Strict exact-source regression
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "$sha" > "$RUNNER_TEMP/budget-evidence/source.sha"
          git bundle create "$RUNNER_TEMP/budget-evidence/source.bundle" HEAD
          python3 -B tools/validate.py --profile strict --source-sha "$sha" --json-out "$RUNNER_TEMP/budget-evidence/strict.json" 2>&1 | tee "$RUNNER_TEMP/budget-evidence/strict.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-budget-${{ github.run_id }}
          path: ${{ runner.temp }}/budget-evidence/
          retention-days: 30
          if-no-files-found: error
