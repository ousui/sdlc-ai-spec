name: SDLC apply reviewed initializer once
on:
  push:
    branches: [impl/spec-kit-plugin-v0]
    paths: ['.github/transport/init/**']
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'ousui/sdlc-ai-spec' && github.ref == 'refs/heads/impl/spec-kit-plugin-v0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Apply exact reviewed initializer changes
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=2 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD^)" = 4eec485fed0900c2b66a0078284bff2a2329b2b3
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import gzip, hashlib, os, pathlib, subprocess
          hashes = ['cbf53b5f4815bb930d82aad9d03c078685432c1a','354f1e4d90b977569e86cd0cf427c6f3a10435e7','9eb69246cc8c7bfbc42b02baca30a0fc0896d209','ad4bce4f4a5a2172f8bf2f185f28865673906415','3e04834f12382e12396888e47956df07cc59b212']
          payload = b''
          for index, expected in enumerate(hashes):
              part = pathlib.Path(f'.github/transport/init/part-{index}')
              actual = subprocess.check_output(['git','hash-object',str(part)], text=True).strip()
              assert actual == expected, (index,actual)
              payload += part.read_bytes()
          assert hashlib.sha256(payload).hexdigest() == '50f479fd24c5fab1067a64244cca41bbe30d60861cffe90ae0c2607cedd1a750'
          patch = pathlib.Path(os.environ['RUNNER_TEMP'])/'sdlc-init.patch'
          patch.write_bytes(gzip.decompress(payload))
          subprocess.run(['git','apply','--index','--unidiff-zero','--whitespace=error-all',str(patch)],check=True)
          PY
      - name: Install pinned upstream and collect independent baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdlc-init/upstream" "$RUNNER_TEMP/sdlc-init/baselines" "$RUNNER_TEMP/sdlc-init/logs"
          UPSTREAM_SHA=$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["commit"])')
          test "$UPSTREAM_SHA" = a4e25ce6b96dc8e85f84206c6a54353fa9c5260b
          git -C "$RUNNER_TEMP/sdlc-init/upstream" init .
          git -C "$RUNNER_TEMP/sdlc-init/upstream" remote add origin https://github.com/github/spec-kit.git
          git -C "$RUNNER_TEMP/sdlc-init/upstream" fetch --depth=1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/sdlc-init/upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sdlc-init/upstream" rev-parse HEAD)" = "$UPSTREAM_SHA"
          python3 -m venv "$RUNNER_TEMP/sdlc-init-env"
          "$RUNNER_TEMP/sdlc-init-env/bin/python" -m pip install -r tools/requirements.txt "$RUNNER_TEMP/sdlc-init/upstream" > "$RUNNER_TEMP/sdlc-init/logs/install.log" 2>&1
          "$RUNNER_TEMP/sdlc-init-env/bin/python" -m pip freeze > "$RUNNER_TEMP/sdlc-init/logs/pip-freeze.txt"
          "$RUNNER_TEMP/sdlc-init-env/bin/specify" version > "$RUNNER_TEMP/sdlc-init/logs/version.log" 2>&1
          for agent in codex claude cursor-agent; do
            mkdir "$RUNNER_TEMP/sdlc-init/baselines/$agent"
            (cd "$RUNNER_TEMP/sdlc-init/baselines/$agent" && "$RUNNER_TEMP/sdlc-init-env/bin/specify" init . --integration "$agent" --script sh --ignore-agent-tools --non-interactive --integration-options="--events=false") > "$RUNNER_TEMP/sdlc-init/logs/init-$agent.log" 2>&1
          done
      - name: Build and verify the exact reviewed product tree
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/sdlc-init-env/bin/python"
          "$PY" -B tools/port.py --upstream "$RUNNER_TEMP/sdlc-init/upstream"
          "$PY" -B tools/build.py --marketplaces
          "$PY" -B tools/verify.py --upstream "$RUNNER_TEMP/sdlc-init/upstream" --baselines "$RUNNER_TEMP/sdlc-init/baselines" --evidence "$RUNNER_TEMP/sdlc-init/precommit"
          git add -A
          git diff --cached --check
          cp .git/index "$RUNNER_TEMP/sdlc-init-product.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/sdlc-init-product.index" git rm -r --cached -- .github/transport/init .github/workflows/materialize-init-once.yml
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/sdlc-init-product.index" git write-tree)" = 15811ccfbb4c359265213b5702c1c8b427f117d6
          git -c user.name=Blade -c user.email=blade@breaklegsquad.com commit -m 'feat: add idempotent project-only sdlc-init across three hosts'
          git rev-parse HEAD > "$RUNNER_TEMP/sdlc-init/commit.txt"
          GITHUB_SHA=$(git rev-parse HEAD) "$PY" -B tools/verify.py --upstream "$RUNNER_TEMP/sdlc-init/upstream" --baselines "$RUNNER_TEMP/sdlc-init/baselines" --evidence "$RUNNER_TEMP/sdlc-init/verification"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Fast-forward only the authorized branch without workflow changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ousui/sdlc-ai-spec
          test "$GITHUB_REF" = refs/heads/impl/spec-kit-plugin-v0
          test "$(git ls-remote origin refs/heads/impl/spec-kit-plugin-v0 | cut -f1)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only "$SOURCE_SHA" HEAD -- .github)"
          git -c credential.helper='!f() { if test "$1" = get; then printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; fi; }; f' push origin HEAD:refs/heads/impl/spec-kit-plugin-v0
      - name: Preserve source and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdlc-init-export" "$RUNNER_TEMP/sdlc-init"
          git archive HEAD | gzip > "$RUNNER_TEMP/sdlc-init-export/product-source.tar.gz"
          tar --exclude=.git -czf "$RUNNER_TEMP/sdlc-init-export/source-and-baselines.tar.gz" -C "$RUNNER_TEMP/sdlc-init" .
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdlc-init-materialized-${{ github.sha }}
          path: ${{ runner.temp }}/sdlc-init-export/
          retention-days: 7
          if-no-files-found: error
