name: closure-confirmed
on:
  push:
    branches: [fix/realflow-closure-v1]
    paths: [.github/workflows/closure-confirmed.yml]
permissions:
  contents: read
concurrency:
  group: closure-confirmed
  cancel-in-progress: false
jobs:
  materialize-then-verify:
    if: github.repository == 'ousui/sdlc-ai-spec' && github.ref == 'refs/heads/fix/realflow-closure-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact reviewed bytes before tests, then remove one-use transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/closure-evidence"
          python3 - <<'PY'
          import base64,hashlib,lzma,os,subprocess
          from pathlib import Path
          base='1ef0a98baec961bae51d1de362de4a301761d434'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          allowed={'.github/closure-confirmed/part1.txt','.github/closure-confirmed/part2.txt','.github/workflows/closure-confirmed.yml'}
          assert set(git('diff','--name-only',base,'HEAD').splitlines()) == allowed, 'Unexpected branch changes'
          packed=base64.b64decode(''.join(Path('.github/closure-confirmed/'+n+'.txt').read_text() for n in ('part1','part2')),validate=True)
          dec=lzma.LZMADecompressor();raw=dec.decompress(packed,max_length=1024*1024)
          assert dec.eof and not dec.unused_data
          assert hashlib.sha256(raw).hexdigest()=='d42891ebd55d2bf1538c65af6af1fabc65d40d797c5cca6188fe79a79226362d'
          patch=Path(os.environ['RUNNER_TEMP'])/'closure-evidence/reviewed.patch';patch.write_bytes(raw)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          subprocess.run(['git','rm','--',*sorted(allowed)],check=True)
          assert git('write-tree')=='8421b81cd76761d5092147fe9cea7904b4f29915','Reviewed tree mismatch'
          PY
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/fix/realflow-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind terminal verification and release to exact reviewable evidence'
          git push origin HEAD:refs/heads/fix/realflow-closure-v1
          git rev-parse HEAD > "$RUNNER_TEMP/closure-evidence/source.sha"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/closure-evidence/source.tree"
          git bundle create "$RUNNER_TEMP/closure-evidence/source.bundle" HEAD
      - name: Independently validate immutable candidate, never regenerate during validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/validate.py --profile full --source-sha "$(git rev-parse HEAD)" --json-out "$RUNNER_TEMP/closure-evidence/full.json" 2>&1 | tee "$RUNNER_TEMP/closure-evidence/full.log"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure-confirmed-${{ github.sha }}
          path: ${{ runner.temp }}/closure-evidence/
          if-no-files-found: error
          retention-days: 30
