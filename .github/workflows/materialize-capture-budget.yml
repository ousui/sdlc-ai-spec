name: materialize-capture-budget
on:
  push:
    branches: [fix/fansite-closure-v1]
    paths: [.github/workflows/materialize-capture-budget.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'ousui/sdlc-ai-spec' && github.ref == 'refs/heads/fix/fansite-closure-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact reviewed bytes and remove one-time transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 0102b8f42a87809f58f978e2c2611705b30e7869
          python3 - <<'PY'
          import base64,zlib,hashlib,subprocess
          from pathlib import Path
          encoded=' '
          raw=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='a768e22b6f9f9f8c9a5d5b6195505b52c401fb517542c2f3275c8e5a22bc9a34'
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          Path('.github/workflows/materialize-capture-budget.yml').unlink()
          subprocess.run(['git','add','-u','.github/workflows/materialize-capture-budget.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='652a323db774b4a29b8a5fccf8a8bf3f5c4fd2af'
          PY
          test "$(git ls-remote origin refs/heads/fix/fansite-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(vfy): bound log capture independently of compiler scratch files'
          git push origin HEAD:refs/heads/fix/fansite-closure-v1
