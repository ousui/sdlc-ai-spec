name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m compileall packages scripts
      - run: python3 tools/validate_runtime_contracts.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
