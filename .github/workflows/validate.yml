name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install explicitly locked test dependencies
        run: python -m pip install --require-hashes -r packages/sdlc_github/requirements.lock
      - name: Unified one-pass full regression
        env:
          SDLC_GITHUB_TOKEN: ''
          SDLC_GITHUB_TOKEN_B: ''
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          SOURCE=$(git rev-parse HEAD)
          python -B tools/validate.py --profile full --source-sha "$SOURCE" --json-out "$RUNNER_TEMP/sdlc-validation/full.json"
      - name: Preserve exact credential-free source and evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sdlc-validation"
          git bundle create "$RUNNER_TEMP/sdlc-validation/source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/sdlc-validation/SOURCE-SHA.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdlc-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/sdlc-validation/
          retention-days: 7
