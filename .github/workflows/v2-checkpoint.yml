name: v2-checkpoint
on:
  push:
    branches: [impl/sdlc-v2-structured-runtime]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-and-package:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the single v2 runtime and installed copy
        run: python -B tools/validate.py --profile full --evidence-dir "$RUNNER_TEMP/sdlc-v2-evidence"
      - name: Build the local plugin artifact
        run: python -B tools/build_plugin.py --output "$RUNNER_TEMP/sdlc-v2-plugin"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-checkpoint-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sdlc-v2-evidence/
            ${{ runner.temp }}/sdlc-v2-plugin.zip
          retention-days: 14
