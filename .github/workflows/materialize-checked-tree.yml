name: materialize-checked-tree
on:
  push:
    branches: [fix/fansite-closure-v1]
    paths: [.github/workflows/materialize-checked-tree.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize only the previously tested exact source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/fansite-closure-v1
          git diff --exit-code 0102b8f42a87809f58f978e2c2611705b30e7869 HEAD -- skills packages tests
          python3 - <<'PY'
          import base64,zlib,hashlib,re,subprocess
          from pathlib import Path
          y=Path('.github/workflows/materialize-capture-budget.yml').read_text()
          encoded=re.search(r"encoded='([^']+)'",y).group(1)
          raw=zlib.decompress(base64.b64decode(encoded))
          print('Transport checksum:',hashlib.sha256(raw).hexdigest(),flush=True)
          expected={
           'skills/sdlc-500-vfy/scripts/vfy_executor.py':'d04ff73a0ab17230801e366e4ba43d78cfc8a8c9',
           'skills/sdlc-500-vfy/scripts/vfy_process_capture.py':'90b0e18d3f468f9769ddf6bd43df69204dc4c3d0',
           'tests/skill_vfy/test_network_filter.py':'42a5d82d469d9de5fd74e2364dfce33b9a0136c7',
           'tests/skill_vfy/test_output_scratch_budget.py':'49df3292a0f89027263b7c1fafef9d274f64ee54'}
          paths=subprocess.check_output(['git','apply','--numstat','-'],input=raw).decode().splitlines()
          assert {line.split('\t',2)[2] for line in paths}==set(expected),'Unapproved patch paths'
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          for path,digest in expected.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              print(path,actual,flush=True)
              assert actual==digest,'Source bytes differ from the locally tested candidate'
          for name in ('materialize-capture-budget.yml','check-capture-transport.yml','materialize-checked-tree.yml'):
              Path('.github/workflows',name).unlink()
          subprocess.run(['git','add','-u','.github/workflows'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          print('Final source tree:',tree,flush=True)
          assert tree=='652a323db774b4a29b8a5fccf8a8bf3f5c4fd2af','Complete source tree differs'
          PY
          test "$(git ls-remote origin refs/heads/fix/fansite-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(vfy): separate bounded log capture from native scratch-file budgets'
          git push origin HEAD:refs/heads/fix/fansite-closure-v1
