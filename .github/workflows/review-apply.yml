name: review-apply
on:
  push:
    branches: [fix/v2-review-github-sharing]
    paths: [.github/workflows/review-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize the exact reviewed source patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/v2-review-github-sharing
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, gzip, hashlib, io, os
          from pathlib import Path
          # Temporary source transport, removed after a normal source commit.
          corrections = {1: [(3984, 3985, ''), (14080, 14080, '4')],
                         2: [(3799, 3800, ''), (11601, 11602, ''), (14081, 14084, 'z')]}
          expected = ['6e7766b4fcf4e052efe23f7295a0e8f6d4e776c6',
                      'b307c06600de47d737708f4287b7ec48e9bc8a75',
                      '6c4035bad9fc5e28fa6ddd0db48e0316119eb8a8',
                      '65c31c0e4de40f0f9b6edf25bb00926f7e75e91c']
          pieces = []
          for i in range(4):
              raw = Path(f'.github/review-parts/{i:02}.bin').read_bytes()
              encoded = base64.b64encode(raw).decode()
              for a, b, replacement in reversed(corrections.get(i, [])):
                  encoded = encoded[:a] + replacement + encoded[b:]
              raw = base64.b64decode(encoded, validate=True)
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest() == expected[i]
              pieces.append(raw)
          packed = b''.join(pieces)
          assert hashlib.sha256(packed).hexdigest() == 'caa736f1ae0d2af386106a077196cc59dd0a6c37f7aa3310fcbaa96fd323af7b'
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
              patch = stream.read(262145)
          assert len(patch) == 131601
          Path(os.environ['RUNNER_TEMP'], 'review.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/review.patch"
          git apply --index "$RUNNER_TEMP/review.patch"
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/v2/review_support.py')
          p.write_bytes(p.read_bytes().rstrip(b'\n') + b'\n')
          PY
          python -B tools/build_v2_contract.py
          git add contracts/v2.json tests/v2/review_support.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v2): repair phase gates, file modes, transfer, delivery and restore Issue sharing'
          git push origin HEAD:refs/heads/fix/v2-review-github-sharing
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/materialized-source"
          git rev-parse HEAD > "$RUNNER_TEMP/materialized-source/source.sha"
          git bundle create "$RUNNER_TEMP/materialized-source/source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materialized-review-source-${{ github.run_id }}
          path: ${{ runner.temp }}/materialized-source/
          retention-days: 14
  portable:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B tools/validate_portable.py --evidence-dir "$RUNNER_TEMP/portable"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-portable-${{ needs.apply.outputs.source }}
          path: ${{ runner.temp }}/portable/
          retention-days: 14
  native:
    needs: apply
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select actual interpreter
        id: python-runtime
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          framework = Path(sys.base_prefix)/'Resources/Python.app/Contents/MacOS/Python'
          executable = framework if framework.is_file() else Path(sys.executable).resolve()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write(f'executable={executable}\n')
          PY
      - name: Full native regression including real RLS and large history
        run: '"${{ steps.python-runtime.outputs.executable }}" -B tools/validate.py --profile full --evidence-dir "$RUNNER_TEMP/native"'
      - name: Build installed plugin
        run: '"${{ steps.python-runtime.outputs.executable }}" -B tools/build_plugin.py --output "$RUNNER_TEMP/plugin"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-native-${{ needs.apply.outputs.source }}
          path: |
            ${{ runner.temp }}/native/
            ${{ runner.temp }}/plugin.zip
          retention-days: 14
