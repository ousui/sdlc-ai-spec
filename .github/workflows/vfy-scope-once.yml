name: vfy-scope-once
on:
  push:
    branches: [fix/realflow-closure-v1]
    paths: [.github/workflows/vfy-scope-once.yml]
permissions:
  contents: write
jobs:
  apply-reviewed:
    if: github.repository == 'ousui/sdlc-ai-spec'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize reviewed scope repair
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/realflow-closure-v1
          git merge-base --is-ancestor 7025f1b165de4ac1f250e8587bcae7ef7b64e11a HEAD
          mkdir -p "$RUNNER_TEMP/scope-evidence"
          python3 - <<'PY'
          import os,hashlib,subprocess
          from pathlib import Path
          p=Path('tools/closure-vfy-scope.patch')
          raw=p.read_bytes().replace(b'\n diff --git ',b'\ndiff --git ')
          assert hashlib.sha256(raw).hexdigest()=='b71fc6217fa9548ee8d414c6940bd5771f949c3a953bdfc474aafd1fc39ad5c4'
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','-'],input=raw,check=True)
          (Path(os.environ['RUNNER_TEMP'])/'scope-evidence/repair.patch').write_bytes(raw)
          p.unlink();Path('.github/workflows/vfy-scope-once.yml').unlink()
          PY
          python3 -B -m unittest tests.skill_vfy.test_selected_scope_history tests.skill_vfy.test_persistence -v > "$RUNNER_TEMP/scope-evidence/targeted.log" 2>&1
          git add skills/sdlc-500-vfy/scripts/vfy_authority.py tests/skill_vfy/test_selected_scope_history.py tools/closure-vfy-scope.patch .github/workflows/vfy-scope-once.yml
          git diff --cached --check
          test "$(git write-tree)" = b739f25e7d3e89918d0766b4835ab111902a4cf3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(vfy): resolve exact selected scope ancestry without historical ambiguity'
          git rev-parse HEAD > "$RUNNER_TEMP/scope-evidence/source.sha"
          git bundle create "$RUNNER_TEMP/scope-evidence/source.bundle" HEAD
          test "$(git ls-remote origin refs/heads/fix/realflow-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/realflow-closure-v1
      - name: Full regression of committed source
        run: python3 -B tools/validate.py --profile full --source-sha "$(git rev-parse HEAD)" --json-out "$RUNNER_TEMP/scope-evidence/full.json" > "$RUNNER_TEMP/scope-evidence/full.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfy-scope-${{ github.sha }}
          path: ${{ runner.temp }}/scope-evidence/
          if-no-files-found: error
          retention-days: 30
