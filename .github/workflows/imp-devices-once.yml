name: imp-devices-once
on:
  push:
    branches: [fix/realflow-closure-v1]
    paths: [.github/workflows/imp-devices-once.yml]
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact private-device policy without altering any Oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/realflow-closure-v1
          test "$(git rev-parse HEAD^)" = a988d737dec0b902f19bbe47b80ca49280e615ed
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('skills/sdlc-400-imp/scripts/imp_executor.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='71efa565e1e1a32dc60e6c063ec9e57871a305f0beb6fae9b8e862a7cdcd3e36'
          s=p.read_text()
          old='            "--ro-bind", "/", "/", "--", "/bin/true",'
          assert s.count(old)==1
          s=s.replace(old,'            "--ro-bind", "/", "/", "--dev", "/dev", "--", "/bin/true",')
          old='        "--ro-bind", "/", "/", "--bind", temporary, temporary,\n        "--", *command,'
          assert s.count(old)==1
          s=s.replace(old,'        "--ro-bind", "/", "/", "--bind", temporary, temporary,\n        "--dev", "/dev", "--", *command,')
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='325ea30a42d7cb90cd7f84d807a6e97b161a338fbb9b78df7d0cd5a139e66d61'
          Path('.github/workflows/imp-devices-once.yml').unlink()
          PY
      - name: Commit exact repaired source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/realflow-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git add -- skills/sdlc-400-imp/scripts/imp_executor.py .github/workflows/imp-devices-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(imp): provide private devices to native isolated project checks' -m 'Probe and execution share minimal sandbox /dev; host paths remain read-only and no bare fallback is added. Refs ousui/test-sdlc#16.'
          git push origin HEAD:refs/heads/fix/realflow-closure-v1
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: materialize
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare supported containment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/device-evidence" "$RUNNER_TEMP/device-tools"
          if ! command -v bwrap >/dev/null; then
            cd "$RUNNER_TEMP/device-tools"
            apt-get download bubblewrap
            for p in bubblewrap_*.deb; do dpkg-deb -x "$p" extracted; done
            echo "$PWD/extracted/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Observe native device policy then run complete strict regression
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "$sha" > "$RUNNER_TEMP/device-evidence/source.sha"
          git bundle create "$RUNNER_TEMP/device-evidence/source.bundle" HEAD
          python3 -B - <<'PY'
          from tests.skill_imp import support
          from imp_executor import _sandbox_adapter, _sandbox_ready
          assert _sandbox_adapter('mvn') == 'linux-bwrap'
          assert _sandbox_ready('linux-bwrap')
          PY
          python3 -B -m unittest tests.skill_imp.test_native_device_boundary -v 2>&1 | tee "$RUNNER_TEMP/device-evidence/targeted.log"
          python3 -B tools/validate.py --profile strict --source-sha "$sha" --json-out "$RUNNER_TEMP/device-evidence/strict.json" 2>&1 | tee "$RUNNER_TEMP/device-evidence/strict.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-device-${{ github.run_id }}
          path: ${{ runner.temp }}/device-evidence/
          retention-days: 30
          if-no-files-found: error
