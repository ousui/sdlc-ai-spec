name: v2-checkpoint
on:
  push:
    branches: [impl/sdlc-v2-structured-runtime]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-and-package:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select the direct Python executable for Seatbelt
        id: python-runtime
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          # Framework launchers use posix_spawn, which the collector deliberately
          # denies to prevent process-group/session escapes. Run the interpreter
          # itself; retain the same sandbox policy and all execution assertions.
          framework = Path(sys.base_prefix) / "Resources/Python.app/Contents/MacOS/Python"
          executable = framework if framework.is_file() else Path(sys.executable).resolve()
          print(f"Python launcher: {sys.executable}; direct executable: {executable}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"executable={executable}\n")
          PY
      - name: Validate the single v2 runtime and installed copy
        run: '"${{ steps.python-runtime.outputs.executable }}" -B tools/validate.py --profile full --evidence-dir "$RUNNER_TEMP/sdlc-v2-evidence"'
      - name: Build the local plugin artifact
        run: '"${{ steps.python-runtime.outputs.executable }}" -B tools/build_plugin.py --output "$RUNNER_TEMP/sdlc-v2-plugin"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-checkpoint-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sdlc-v2-evidence/
            ${{ runner.temp }}/sdlc-v2-plugin.zip
          retention-days: 14
