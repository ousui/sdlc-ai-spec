name: web-ctx-review-preparation
on:
  push:
    branches: [verify/web-realflow-v1]
    paths: [.github/workflows/web-ctx-review-preparation.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'ousui/sdlc-ai-spec' && github.ref == 'refs/heads/verify/web-realflow-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/web-realflow-v1
          fetch-depth: 0
      - name: Add explicit review preparation without weakening final confirmation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('skills/sdlc-000-ctx/scripts/runtime.py')
          s=p.read_text()
          replacements=[
          ('    final_confirmation = None\n    if not errors and not open_items:', '''    # Persist reviewable content before asking an independent execution to confirm.
              # Confirmation-only waiting is a control result, not a missing domain fact.
              prepare_confirmation = invocation.get("options", {}).get("prepare_confirmation", False)
              if not isinstance(prepare_confirmation, bool):
                  errors.append({"code": "INVALID_PREPARE_CONFIRMATION", "message": "prepare_confirmation must be boolean"})
              review_draft = False
              final_confirmation = None
              if not errors and not open_items:'''),
          ('            checks = _pending_checks(open_items, [])\n        elif final_confirmation', '''            review_draft = prepare_confirmation is True
                      checks = complete_checks if review_draft else _pending_checks(open_items, [])
                  elif final_confirmation'''),
          ('        status = "waiting_input"\n    else:', '        status = "draft" if review_draft else "waiting_input"\n    else:'),
          ('        model, status=status, open_items=open_items, checks=checks,\n        final_confirmation=final_confirmation, gate_summary=gate_summary,', '        model, status=status, open_items=[] if review_draft else open_items, checks=checks,\n        final_confirmation=final_confirmation, gate_summary=gate_summary,')]
          # The multiline strings above contain the desired Python indentation.
          for old,new in replacements:
              if s.count(old)!=1: raise SystemExit('Refusing source drift: '+old[:80])
              s=s.replace(old,new)
          p.write_text(s)
          compile(s,str(p),'exec')
          p=Path('skills/sdlc-000-ctx/references/contract.md')
          p.write_text(p.read_text()+'''\n## 精确确认准备\n\n当需要独立复核时，create/revise 的标准 Invocation 可显式设置布尔 `options.prepare_confirmation=true`。真实项目输入完整且仅缺少最终确认时，Runtime 持久化未冻结 draft，关闭除 CORE-G-009 外的适用检查，Result 仍为 action_required。确认等待保留在 Result，不污染用于独立摘要复核的业务正文。真实 Open Items、错误和 Exception 不隐藏。\n\n先写入并通过只读 Store 读回该准确 Revision；Reviewer 独立计算当前 Control Input Digest、Evaluation Contract Set 与 Check Set Result Digest。再以相同 context/evidence/refresh 输入和合法当前 Confirmation 执行 revise；缺记录、摘要不符、拒绝确认均不能冻结。原有未设置此选项的行为不变。\n''')
          p=Path('skills/sdlc-000-ctx/SKILL.md')
          s=p.read_text()
          marker='## 输出与完成条件'
          assert s.count(marker)==1
          s=s.replace(marker,'需要独立最终复核时，按运行契约显式设置 `options.prepare_confirmation=true`，先持久化并读回准确 review draft。确认者必须复核实际字节和当前检查摘要；缺少确认仍不冻结。该选项不隐藏真实业务输入缺口。\n\n'+marker)
          p.write_text(s)
          Path('tests/skills/test_ctx_preconfirmation.py').write_text('''"""Preconfirmation must refer to bytes available to the independent reader."""
          import hashlib
          import re
          import unittest
          from tests.skills import test_sdlc_000_ctx as fixture

          class CtxPreconfirmationTests(unittest.TestCase):
              def setUp(self):
                  self.fixture=fixture.CtxRuntimeTests()
                  self.fixture.setUp()
                  self.addCleanup(self.fixture.tearDown)
              def prepared(self, request=None):
                  request=request or self.fixture.invocation()
                  request['options']['prepare_confirmation']=True
                  result=self.fixture.invoke(request)
                  a=result['artifact']
                  reader=fixture.runtime.ArtifactStore.open_read_only(self.fixture.project_root)
                  return result,reader.read_revision(a['id'],a['revision'])
              def test_review_draft_binds_actual_persisted_control_bytes(self):
                  result,stored=self.prepared()
                  text=stored.payload.primary_blob.decode()
                  content=re.sub(r'(?m)^status: .*\\n','',text).split('## 门禁 Gate\\n')[0]
                  computed='sha256:'+hashlib.sha256(content.encode()).hexdigest()
                  binding=next(w['details'] for w in result['warnings'] if w['code']=='FINAL_CONFIRMATION_BINDINGS')
                  self.assertEqual(binding['control_input_digest'],computed)
                  self.assertEqual(stored.payload.artifact_status,'draft')
                  self.assertEqual(stored.control.state,'open')
                  self.assertFalse(result['ok'])
                  self.assertEqual(result['status'],'action_required')
                  self.assertEqual(result['gate']['result'],'pending')
              def test_review_draft_closes_actual_checks_other_than_final_confirmation(self):
                  result,stored=self.prepared()
                  text=stored.payload.primary_blob.decode()
                  rows=[l for l in text.splitlines() if re.match(r'^\\| (CORE|CTX)-G-\\d{3} \\|',l)]
                  non_final=[l for l in rows if not l.startswith('| CORE-G-009 |')]
                  self.assertTrue(non_final)
                  self.assertTrue(all(l.split('|')[3].strip()=='pass' for l in non_final))
                  computed='sha256:'+hashlib.sha256(('\\n'.join(non_final)+'\\n').encode()).hexdigest()
                  binding=next(w['details'] for w in result['warnings'] if w['code']=='FINAL_CONFIRMATION_BINDINGS')
                  self.assertEqual(computed,binding['check_set_result_digest'])
                  self.assertEqual(fixture.runtime.validate_stored_revision(stored)[:2],([], 'pending'))
              def test_prepare_cannot_hide_missing_domain_facts(self):
                  request=self.fixture.invocation()
                  request['inputs']['context']['project_identity'].pop('purpose')
                  result,stored=self.prepared(request)
                  self.assertNotEqual(stored.payload.artifact_status,'ready')
                  self.assertEqual(stored.control.state,'open')
                  self.assertIn('OPI-',stored.payload.primary_blob.decode())
                  self.assertFalse(any(w['code']=='FINAL_CONFIRMATION_BINDINGS' for w in result['warnings']))
              def test_prepared_check_is_read_only_and_not_authority(self):
                  result,stored=self.prepared()
                  before=(self.fixture.project_root/'.sdlc/store.sqlite3').read_bytes()
                  checked=self.fixture.invoke(self.fixture.invocation('check',reference=f'{stored.payload.artifact_id}@1'))
                  self.assertTrue(checked['ok'],checked)
                  self.assertEqual(checked['gate']['result'],'pending')
                  self.assertIsNone(checked['artifact']['reference'])
                  self.assertEqual(before,(self.fixture.project_root/'.sdlc/store.sqlite3').read_bytes())
              def test_invalid_option_cannot_approve(self):
                  request=self.fixture.invocation()
                  request['options']['prepare_confirmation']='true'
                  result=self.fixture.invoke(request)
                  self.assertFalse(result['ok'])
                  self.assertEqual(result['gate']['result'],'fail')
                  self.assertTrue(any(e['code']=='INVALID_PREPARE_CONFIRMATION' for e in result['errors']))
          ''')
          PY
      - name: Targeted tests and exact commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-evidence"
          python3 -B -m unittest tests.skills.test_ctx_preconfirmation tests.skills.test_ctx_member_digest tests.skills.test_sdlc_000_ctx -v 2>&1 | tee "$RUNNER_TEMP/review-evidence/targeted.log"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/sdlc-000-ctx/scripts/runtime.py skills/sdlc-000-ctx/SKILL.md skills/sdlc-000-ctx/references/contract.md tests/skills/test_ctx_preconfirmation.py
          git commit -m 'fix(ctx): persist an exact draft before independent confirmation'
          git rev-parse HEAD > "$RUNNER_TEMP/review-evidence/source.sha"
          git diff HEAD^ HEAD > "$RUNNER_TEMP/review-evidence/repair.patch"
      - name: Full exact-source regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/validate.py --profile full --source-sha "$(git rev-parse HEAD)" --json-out "$RUNNER_TEMP/review-evidence/full.json" 2>&1 | tee "$RUNNER_TEMP/review-evidence/full.log"
      - name: Preserve exact source and publish only authorized branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verify/web-realflow-v1
          test -z "$(git status --porcelain)"
          git bundle create "$RUNNER_TEMP/review-evidence/source.bundle" HEAD
          git push origin HEAD:refs/heads/verify/web-realflow-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctx-review-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/review-evidence/
          if-no-files-found: error
          retention-days: 30
