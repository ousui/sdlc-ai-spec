name: python-checks-once
on:
  push:
    branches: [fix/realflow-closure-v1]
    paths: [.github/workflows/python-checks-once.yml]
permissions:
  contents: write
jobs:
  apply-reviewed:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact repair bytes and remove one-time transport
        env:
          PATCH_DATA: 
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/realflow-closure-v1
          test "$(git rev-parse HEAD^)" = ea39f055926c58bc7f16c747bd743beac211c50c
          mkdir -p "$RUNNER_TEMP/python-check-evidence"
          python3 - <<'PY'
          import os,base64,zlib,hashlib,subprocess
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(os.environ['PATCH_DATA'],validate=True))
          assert hashlib.sha256(raw).hexdigest()=='002cfb55c5b4d110ccbc3cf4c721fc6e13eb27cdaf3e992a36118f2be718b772'
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','-'],input=raw,check=True)
          (Path(os.environ['RUNNER_TEMP'])/'python-check-evidence/repair.patch').write_bytes(raw)
          Path('.github/workflows/python-checks-once.yml').unlink()
          PY
          python3 -B -m unittest tests.skill_imp.test_python_project_imports tests.skill_imp.test_failed_check_retry tests.skill_imp.test_critical_gaps.CriticalGapTests.test_python_project_check_denies_network_processes_and_snapshot_external_writes -v 2>&1 | tee "$RUNNER_TEMP/python-check-evidence/targeted.log"
          git add skills/sdlc-400-imp/scripts/imp_handler.py skills/sdlc-400-imp/scripts/imp_project_check.py tests/skill_imp/test_python_project_imports.py tests/skill_imp/test_failed_check_retry.py .github/workflows/python-checks-once.yml
          git diff --cached --check
          test "$(git write-tree)" = d50e981b5e1ca6fd0084a8465684c77fe84478a8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(imp): run installed Python tests and retry failed checks without replaying effects'
          git rev-parse HEAD > "$RUNNER_TEMP/python-check-evidence/source.sha"
          git bundle create "$RUNNER_TEMP/python-check-evidence/source.bundle" HEAD
          test "$(git ls-remote origin refs/heads/fix/realflow-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/realflow-closure-v1
      - name: Full regression on exact committed source
        run: python3 -B tools/validate.py --profile full --source-sha "$(git rev-parse HEAD)" --json-out "$RUNNER_TEMP/python-check-evidence/full.json" > "$RUNNER_TEMP/python-check-evidence/full.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-checks-${{ github.sha }}
          path: ${{ runner.temp }}/python-check-evidence/
          if-no-files-found: error
          retention-days: 30
