name: network-boundary-once
on:
  push:
    branches: [fix/realflow-closure-v1]
    paths: [.github/workflows/network-boundary-once.yml]
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed patch and remove transport
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/realflow-closure-v1
          test "$(git rev-parse HEAD^)" = 3af50e8ea4f6aed41f9c5ff963e7dbff0d273387
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('skills/sdlc-500-vfy/scripts/vfy_executor.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='024b53fe65afc2fb719fc46ce67096befa6ea378c147fef1e8bdf2711f585e86'
          s=p.read_text().replace('import hashlib\n','import hashlib\nfrom contextlib import ExitStack\n',1)
          old='    with stdout_path.open("wb") as stdout, stderr_path.open("wb") as stderr:\n        process = subprocess.Popen(\n            _sandbox_argv(argv, root, cwd),'
          new='''    with ExitStack() as stack:
                  sandbox = _sandbox_argv(argv, root, cwd)
                  descriptors = ()
                  if sys.platform.startswith("linux"):
                      from vfy_network_filter import network_filter_bytes
                      network_filter = stack.enter_context(tempfile.TemporaryFile(dir=root))
                      network_filter.write(network_filter_bytes())
                      network_filter.flush()
                      network_filter.seek(0)
                      descriptors = (network_filter.fileno(),)
                      boundary = sandbox.index("--")
                      sandbox[boundary:boundary] = ["--seccomp", str(descriptors[0])]
                  stdout = stack.enter_context(stdout_path.open("wb"))
                  stderr = stack.enter_context(stderr_path.open("wb"))
                  process = subprocess.Popen(
                      sandbox,'''
          assert s.count(old)==1;s=s.replace(old,new,1)
          s=s.replace('            shell=False,\n            start_new_session=True,','            shell=False,\n            pass_fds=descriptors,\n            start_new_session=True,',1)
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='17e33180d51bed75b24786cd44a5c125ccf331b4f3a0f961d4a5c23504489c62'
          p=Path('skills/sdlc-500-vfy/scripts/vfy_network_filter.py');assert not p.exists()
          p.write_text('''"""Classic BPF for Linux's existing network-disabled command policy.

          A private network namespace alone still permits loopback listeners. This filter
          adds process-tree socket-operation denial without changing any host settings.
          The numbers are Linux UAPI syscall numbers for the named native architectures;
          unrecognized architectures are rejected instead of silently running unfiltered.
          """
          from __future__ import annotations

          import errno
          import platform
          import struct
          import sys

          from vfy_common import VfyError

          # socket creation and socketpair remain available for runtime initialization and
          # local IPC. Network endpoints cannot bind, connect, listen, accept or send.
          # io_uring cannot be used as an alternate entry to the denied socket operations.
          _ARCHITECTURES = {
              "x86_64": (0xC000003E, (42, 43, 44, 46, 49, 50, 288, 307, 425, 426, 427)),
              "aarch64": (0xC00000B7, (200, 201, 202, 203, 206, 211, 242, 269, 425, 426, 427)),
          }


          def network_filter_bytes(machine: str | None = None) -> bytes:
              machine = platform.machine().lower() if machine is None else machine.lower()
              if sys.byteorder != "little" or machine not in _ARCHITECTURES:
                  raise VfyError("VFY_METHOD_NOT_READY", "Network-disabled sandbox has no verified native syscall map", status="action_required")
              arch, denied = _ARCHITECTURES[machine]
              reject = 0x00050000 | errno.EACCES  # SECCOMP_RET_ERRNO
              instructions = [
                  (0x20, 0, 0, 4),              # load seccomp_data.arch
                  (0x15, 1, 0, arch),
                  (0x06, 0, 0, reject),         # reject alternate/compat architectures
                  (0x20, 0, 0, 0),              # load seccomp_data.nr
                  (0x45, 0, 1, 0x40000000),     # reject x32 syscall-number alternate ABI
                  (0x06, 0, 0, reject),
              ]
              for number in denied:
                  instructions.extend(((0x15, 0, 1, number), (0x06, 0, 0, reject)))
              instructions.append((0x06, 0, 0, 0x7FFF0000))  # SECCOMP_RET_ALLOW
              return b"".join(struct.pack("=HBBI", *row) for row in instructions)
          ''')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='1a1648670d084d7f691058217b04b6a2ed05b7602e05f33a661997487f8ac8c4'
          p=Path('tests/skill_vfy/test_network_filter.py');assert not p.exists()
          p.write_text('''"""Network-denial policy preserves original loopback rejection expectations."""
          import errno
          from pathlib import Path
          import struct
          import subprocess
          import sys
          import unittest

          from tests.skill_vfy import support  # noqa: F401 -- load bundled runtime paths
          from vfy_network_filter import network_filter_bytes
          from vfy_common import VfyError


          def interpret(raw, arch, number):
              program = list(struct.iter_unpack('=HBBI', raw))
              accumulator = 0; pc = 0
              while pc < len(program):
                  opcode, yes, no, operand = program[pc]; pc += 1
                  if opcode == 0x20: accumulator = arch if operand == 4 else number
                  elif opcode == 0x15: pc += yes if accumulator == operand else no
                  elif opcode == 0x45: pc += yes if accumulator & operand else no
                  elif opcode == 0x06: return operand
                  else: raise AssertionError('unexpected BPF opcode')
              raise AssertionError('unterminated filter')


          class NetworkFilterTests(unittest.TestCase):
              def test_native_architectures_deny_endpoint_operations(self):
                  for machine, arch, numbers in (
                      ('x86_64', 0xc000003e, (42,43,44,46,49,50,288,307,425,426,427)),
                      ('aarch64', 0xc00000b7, (200,201,202,203,206,211,242,269,425,426,427))):
                      raw = network_filter_bytes(machine)
                      for number in numbers:
                          with self.subTest(machine=machine,number=number):
                              self.assertEqual(0x50000|errno.EACCES, interpret(raw,arch,number))

              def test_file_io_and_process_setup_are_not_globally_denied(self):
                  raw = network_filter_bytes('x86_64')
                  for number in (0,1,2,3,9,41,53,56,59,60,257):
                      self.assertEqual(0x7fff0000,interpret(raw,0xc000003e,number))

              def test_alternate_architecture_and_x32_cannot_bypass(self):
                  raw = network_filter_bytes('x86_64')
                  self.assertEqual(0x50000|errno.EACCES,interpret(raw,0x40000003,102))
                  for number in (0,42,49,307):
                      self.assertEqual(0x50000|errno.EACCES,interpret(raw,0xc000003e,number|0x40000000))

              def test_unknown_machine_fails_closed(self):
                  with self.assertRaises(VfyError) as error: network_filter_bytes('unknown-native-arch')
                  self.assertEqual('VFY_METHOD_NOT_READY',error.exception.code)

              def test_containment_probe_needs_no_precreated_work_directories(self):
                  import os
                  import tempfile
                  from unittest.mock import patch, Mock
                  from vfy_executor import _bounded_process
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      process = Mock(pid=12345); process.wait.return_value = 0
                      def spawn(argv, **kwargs):
                          descriptor = kwargs['pass_fds'][0]
                          self.assertEqual(network_filter_bytes(), os.read(descriptor, 4096))
                          self.assertIn('--seccomp', argv)
                          self.assertFalse(kwargs['shell'])
                          return process
                      with patch('vfy_executor.sys.platform', 'linux'), \\
                           patch('vfy_executor._sandbox_argv', return_value=['bwrap','--','python']), \\
                           patch('vfy_executor.subprocess.Popen', side_effect=spawn), \\
                           patch('vfy_executor.os.killpg'):
                          self.assertEqual((0,'','',False), _bounded_process(['python'],cwd=root,root=root,timeout=5,max_output=4096))

              def test_kernel_enforces_filter_in_separate_process(self):
                  if not sys.platform.startswith('linux'):
                      self.assertTrue(network_filter_bytes('x86_64'))
                      return  # Native Darwin enforcement remains sandbox-exec's responsibility.
                  raw=network_filter_bytes()
                  code=r'''
          import ctypes, errno, socket, struct, sys
          class Filter(ctypes.Structure):
              _fields_=[('code',ctypes.c_ushort),('jt',ctypes.c_ubyte),('jf',ctypes.c_ubyte),('k',ctypes.c_uint32)]
          class Program(ctypes.Structure):
              _fields_=[('len',ctypes.c_ushort),('filter',ctypes.POINTER(Filter))]
          rows=list(struct.iter_unpack('=HBBI',bytes.fromhex(sys.argv[1])))
          array=(Filter*len(rows))(*(Filter(*r) for r in rows)); program=Program(len(rows),array)
          libc=ctypes.CDLL(None,use_errno=True)
          assert libc.prctl(38,1,0,0,0)==0
          assert libc.prctl(22,2,ctypes.byref(program),0,0)==0
          for family in (socket.AF_INET,socket.AF_INET6):
              with socket.socket(family) as s:
                  try:s.bind(('127.0.0.1' if family==socket.AF_INET else '::1',0))
                  except OSError as e:assert e.errno==errno.EACCES
                  else:raise AssertionError('network bind escaped OS filter')
          with socket.socket() as s:
              try:s.connect(('127.0.0.1',9))
              except OSError as e:assert e.errno==errno.EACCES
              else:raise AssertionError('network connect escaped OS filter')
          print('actual-kernel-bind-connect-denied')
          '''
                  result=subprocess.run([sys.executable,'-I','-c',code,raw.hex()],text=True,capture_output=True,timeout=10)
                  self.assertEqual(0,result.returncode,result.stderr)
                  self.assertIn('actual-kernel-bind-connect-denied',result.stdout)
          ''')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='c83ea86fe93b2d6e60facc827209486cb10b2df77ab26119b8cae53f639f96e9'
          Path('.github/workflows/network-boundary-once.yml').unlink()
          PY
      - name: Commit reviewed bytes before validation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/realflow-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git add -- skills/sdlc-500-vfy/scripts/vfy_executor.py skills/sdlc-500-vfy/scripts/vfy_network_filter.py tests/skill_vfy/test_network_filter.py .github/workflows/network-boundary-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(vfy): enforce network-disabled commands including loopback endpoints' -m 'Preserve existing boundary Oracle; add native syscall filtering and six regression checks. No host policy changes or unsandboxed fallback. Refs ousui/test-sdlc#15.'
          git push origin HEAD:refs/heads/fix/realflow-closure-v1
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: materialize
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare containment outside runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/network-evidence" "$RUNNER_TEMP/network-tools"
          if ! command -v bwrap >/dev/null; then
            cd "$RUNNER_TEMP/network-tools"
            apt-get download bubblewrap
            for p in bubblewrap_*.deb; do dpkg-deb -x "$p" extracted; done
            echo "$PWD/extracted/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Strict exact-source regression
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "$sha" > "$RUNNER_TEMP/network-evidence/source.sha"
          git bundle create "$RUNNER_TEMP/network-evidence/source.bundle" HEAD
          python3 -B -m unittest tests.skill_vfy.test_network_filter tests.skill_vfy.test_fresh_review_boundaries -v 2>&1 | tee "$RUNNER_TEMP/network-evidence/targeted.log"
          python3 -B tools/validate.py --profile strict --source-sha "$sha" --json-out "$RUNNER_TEMP/network-evidence/strict.json" 2>&1 | tee "$RUNNER_TEMP/network-evidence/strict.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/network-evidence/
          retention-days: 30
          if-no-files-found: error
