name: closure-bootstrap
on:
  push:
    branches: [fix/realflow-closure-v1]
    paths: [.github/workflows/closure-bootstrap.yml]
permissions:
  contents: write
concurrency:
  group: closure-bootstrap
  cancel-in-progress: false
jobs:
  materialize-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact transport then materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/closure-evidence"
          cp .checkpoint/* "$RUNNER_TEMP/closure-evidence/"
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          parts=[Path(f'.checkpoint/repair-{i:02d}.b64').read_text().strip() for i in range(1,4)]
          # Correct documented text-transport transcription only; full digest remains mandatory.
          parts[1]=parts[1].replace('Nu95oswFrN6rNqrnDYhl','Nu95oswFrN6rN6nDYhl')
          parts[2]=parts[2].replace('pSUSlcXlcX2','pSUSlcX2')
          marker='kMxH2h1246'
          assert parts[2].count(marker)==1
          parts[2]=parts[2].split(marker)[0]+marker+'rjE1NnJC1daR7EQyL8LLxP1U74NGzRDS2CGzNMM9pNiYrQ5rBk0HBL40n8nU4nGR25SXZprsMu/xdGe53kwroAAA=='
          raw=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='f35ad7c97381564f66667818ee788711bfff5ad3cb50f96bcd0669bb7b633b77', 'Transport digest mismatch; no source changes applied'
          patch=gzip.decompress(raw)
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          for path in ['.github/workflows/web-ctx-digest-repair.yml','.github/workflows/web-ctx-review-preparation.yml','.github/workflows/web-req-reference-order.yml','.github/workflows/closure-bootstrap.yml']:
              Path(path).unlink()
          for path in Path('.checkpoint').glob('repair-*.b64'):path.unlink()
          subprocess.run(['git','add','-A'],check=True)
          actual=subprocess.check_output(['git','write-tree']).decode().strip()
          assert actual=='af8b1242ed752287b9b3032a1d1a803751a29b30',('Candidate tree mismatch',actual)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: canonical scope and resumable implementation across real workflows'
          git rev-parse HEAD > "$RUNNER_TEMP/closure-evidence/source.sha"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/closure-evidence/source.tree"
          git bundle create "$RUNNER_TEMP/closure-evidence/source.bundle" HEAD
          test "$(git ls-remote origin refs/heads/fix/realflow-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/realflow-closure-v1
      - name: Run complete contract regression on this exact immutable commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/validate.py --profile full --source-sha "$(git rev-parse HEAD)" --json-out "$RUNNER_TEMP/closure-evidence/full.json" 2>&1 | tee "$RUNNER_TEMP/closure-evidence/full.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/closure-evidence/
          retention-days: 30
          if-no-files-found: error
