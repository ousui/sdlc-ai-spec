name: check-capture-transport
on:
  push:
    branches: [fix/fansite-closure-v1]
    paths: [.github/workflows/check-capture-transport.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect exact transported bytes in disposable checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/capture-debug"
          python3 - <<'PY'
          import base64,zlib,hashlib,re,os,subprocess,json
          from pathlib import Path
          y=Path('.github/workflows/materialize-capture-budget.yml').read_text()
          enc=re.search(r"encoded='([^']+)'",y).group(1)
          raw=zlib.decompress(base64.b64decode(enc))
          out=Path(os.environ['RUNNER_TEMP'])/'capture-debug'
          (out/'actual.patch').write_bytes(raw)
          print('PATCH_SHA256',hashlib.sha256(raw).hexdigest(),flush=True)
          p=subprocess.run(['git','apply','--index','-'],input=raw,capture_output=True)
          print('APPLY',p.returncode,p.stderr.decode(),flush=True)
          for name in ('materialize-capture-budget.yml','check-capture-transport.yml'):
              Path('.github/workflows',name).unlink()
          subprocess.run(['git','add','-u','.github/workflows'],check=True)
          print('TREE',subprocess.check_output(['git','write-tree'],text=True),flush=True)
          print(subprocess.check_output(['git','diff','--cached','--stat'],text=True),flush=True)
          (out/'source.bundle').write_bytes(b'') if False else None
          paths=['skills/sdlc-500-vfy/scripts/vfy_executor.py','skills/sdlc-500-vfy/scripts/vfy_process_capture.py','tests/skill_vfy/test_network_filter.py','tests/skill_vfy/test_output_scratch_budget.py']
          for name in paths:
              path=Path(name)
              if path.exists():
                  dest=out/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(path.read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/capture-debug/
          if-no-files-found: error
          retention-days: 7
