name: SCR exact-source delivery
on:
  push:
    branches: [fix/skill-contract-reliability-v1]
    paths: [.github/workflows/scr-delivery.yml]
permissions:
  contents: write
concurrency:
  group: scr-exact-source-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'ousui/sdlc-ai-spec' && github.ref == 'refs/heads/fix/skill-contract-reliability-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize reviewed repairs and commit the verified source tree
        env:
          EVENT_SHA: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scr-delivery"
          python -B - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          event = os.environ['EVENT_SHA']
          base = 'edfe1f772ec4c92bade2997508fdac3f11b23118'
          branch = 'fix/skill-contract-reliability-v1'
          temporary = {'tools/_scr_delivery_code.py', 'tools/_scr_delivery_plans.py',
                       'tools/_scr_delivery_tests.txt', '.github/workflows/scr-delivery.yml'}
          assert git('rev-parse', 'HEAD') == event
          assert git('rev-parse', 'HEAD^') == base
          assert not git('status', '--porcelain')
          assert set(git('diff', '--name-only', base, event).splitlines()) == temporary
          assert git('ls-remote', 'origin', 'refs/heads/'+branch).split()[0] == event
          subprocess.run(['python', '-B', 'tools/_scr_delivery_plans.py'], check=True)
          subprocess.run(['python', '-B', 'tools/_scr_delivery_code.py'], check=True)
          tests = Path('tests/skill_contract_reliability')
          tests.mkdir()
          (tests/'__init__.py').write_text('"""Cross-skill input-contract regression tests, not a second evaluation gate."""\n')
          (tests/'test_regressions.py').write_bytes(Path('tools/_scr_delivery_tests.txt').read_bytes())
          for item in temporary:
              Path(item).unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = git('write-tree')
          assert tree == 'b95ca645ce21edc2128125e9501ae3fab9fe5f8d', ('TRANSPORT_TREE_MISMATCH', tree)
          name, email = git('show', '-s', '--format=%an%n%ae', base).splitlines()
          subprocess.run(['git', '-c', 'user.name='+name, '-c', 'user.email='+email,
                          'commit', '-m', 'fix(scr): preserve input errors, bypass meta stdin and allocate RLS target identities'], check=True)
          source = git('rev-parse', 'HEAD')
          assert not git('status', '--porcelain')
          assert git('ls-remote', 'origin', 'refs/heads/'+branch).split()[0] == event
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/'+branch], check=True)
          assert git('ls-remote', 'origin', 'refs/heads/'+branch).split()[0] == source
          out = Path(os.environ['RUNNER_TEMP'])/'scr-delivery'
          (out/'SUBJECT.json').write_text(json.dumps({'event_sha':event, 'review_base':base,
              'implementation_sha':source, 'test_source_sha':source, 'tree':tree,
              'branch':branch, 'transport_is_not_test_subject':True}, indent=2)+'\n')
          PY
      - name: Install locked evaluation dependencies
        run: python -m pip install --require-hashes -r packages/sdlc_github/requirements.lock
      - name: Run one-pass regression on the clean implementation SHA
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDLC_GITHUB_TOKEN: ''
          SDLC_GITHUB_TOKEN_B: ''
        run: |
          set -euo pipefail
          SOURCE=$(git rev-parse HEAD)
          python -B tools/validate.py --profile full --source-sha "$SOURCE" --json-out "$RUNNER_TEMP/scr-delivery/full.json"
      - name: Preserve credential-free exact source and evidence
        if: always()
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/scr-delivery"
          git rev-parse HEAD > "$RUNNER_TEMP/scr-delivery/SOURCE-SHA.txt"
          printf '%s\n' "$EVENT_SHA" > "$RUNNER_TEMP/scr-delivery/EVENT-SHA.txt"
          git bundle create "$RUNNER_TEMP/scr-delivery/source.bundle" HEAD
          git diff --binary HEAD > "$RUNNER_TEMP/scr-delivery/uncommitted.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scr-delivery-${{ github.sha }}
          path: ${{ runner.temp }}/scr-delivery/
          retention-days: 30
