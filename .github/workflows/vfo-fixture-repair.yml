name: VFO fixture repair delivery
on:
  push:
    branches: [fix/skill-input-usability-v2]
    paths: [.github/workflows/vfo-fixture-repair.yml]
permissions:
  contents: write
concurrency:
  group: vfo-fixture-repair-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch only stale VFY obligation classifiers
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$(git ls-remote origin refs/heads/fix/skill-input-usability-v2 | cut -f1)" = "$EVENT_SHA"
          python -B - <<'PY'
          from pathlib import Path
          files = (
              Path('tools/run_external_pln_integration.py'),
              Path('tools/rls_fixture_chain.py'),
          )
          old = '("#VFP-", "#OBJ-", "#AC-")'
          new = '("#VFP-", "#VFO-", "#OBJ-", "#AC-")'
          for path in files:
              text = path.read_text()
              assert text.count(old) == 1, (path, text.count(old))
              path.write_text(text.replace(old, new))
          Path('.github/workflows/vfo-fixture-repair.yml').unlink()
          PY
          git diff --check
      - name: Run VFO and previously failing RLS regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest tests.skill_pln.test_vfo_obligations -v
          python -B -m unittest \
            tests.skill_rls.test_critical_cases_final.RlsFinalCriticalCases.test_rls_e011_final \
            tests.skill_rls.test_critical_cases_final.RlsFinalCriticalCases.test_rls_e012_final -v
      - name: Commit exact fixture repair and push with branch CAS
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/skill-input-usability-v2 | cut -f1)" = "$EVENT_SHA"
          git add -- tools/run_external_pln_integration.py tools/rls_fixture_chain.py .github/workflows/vfo-fixture-repair.yml
          git diff --cached --check
          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git commit -m 'test(pln): carry VFO obligations through integration fixtures'
          git push origin HEAD:refs/heads/fix/skill-input-usability-v2
          git rev-parse HEAD
