name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m compileall packages scripts skills
      - run: python3 tools/validate_runtime_contracts.py
      - run: python3 tools/validate_skill_interfaces.py
      - run: python3 tools/validate_lifecycle_query.py
      - run: python3 tools/validate_sdlc_status.py
      - run: python3 tools/validate_sdlc_100_req_source_lock.py
      - run: python3 tools/validate_sdlc_200_dsn_source_lock.py
      - run: python3 tools/test_sdlc_100_req_runtime_independence.py
      - run: python3 tools/test_sdlc_200_dsn_runtime_independence.py
      - run: python3 tools/test_sdlc_status_runtime_independence.py
      - run: python3 tests/evals/run_sdlc_200_dsn_eval.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
