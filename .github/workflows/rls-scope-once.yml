name: rls-scope-once
on:
  push:
    branches: [fix/realflow-closure-v1]
    paths: [.github/workflows/rls-scope-once.yml]
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize two exact reviewed files and remove this transport
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/realflow-closure-v1
          test "$(git rev-parse HEAD^)" = b15a4b30707130e24f74b9744f9e7bf226da5b19
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('skills/sdlc-600-rls/scripts/rls_vfy_adapter.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8937670bb2b6d7cc17ea6930f507ae68e9cc53eeb55f24110f1bd3defd0567de'
          s=p.read_text();start=s.index('def _verify_applicability(');end=s.index('\n\ndef _verify_controls',start)
          replacement='''def _verify_applicability(store, root, state, projection):
              """Read disposition from the exact selected scope, never historical nodes.

              PLN's aggregate is a different canonical table from REQ/DSN lifecycle
              applicability. A missing/invalid selected table must not fall back to an
              earlier phase, because that would silently replace the delivery authority.
              """
              import re
              scope = exact_scope_reference(state["scope"]["reference"])
              selected = _exact_authority(store, root, scope)
              phase = selected.payload.artifact_type
              require(phase in {"PLN", "DSN", "REQ"}, "RLS_VFY_NOT_READY", "Selected scope has no lifecycle applicability")
              parsed = parse_canonical_artifact(selected.payload.primary_blob)
              if phase == "PLN":
                  heading = "## 聚合适用性 Aggregated Applicability"
                  headers = ("Phase", "Effective Disposition", "Host References", "Basis References", "Exception References")
                  disposition_key, basis_key = "Effective Disposition", "Basis References"
              else:
                  heading = "## 生命周期适用性 Lifecycle Applicability"
                  headers = ("Phase", "Disposition", "Host", "判断依据 Basis")
                  disposition_key, basis_key = "Disposition", "判断依据 Basis"
              require(parsed.text.count(heading) == 1, "RLS_VFY_NOT_READY", "Selected applicability section is missing or ambiguous")
              section = re.split(r"(?m)^## ", parsed.text.split(heading, 1)[1], maxsplit=1)[0]
              tables = [table for table in parse_markdown_tables(section) if table.headers == headers]
              require(len(tables) == 1, "RLS_VFY_NOT_READY", "Selected applicability table has an invalid canonical shape")
              rows = [row for row in tables[0].rows if row["Phase"] == "RLS"]
              require(len(rows) == 1 and rows[0][basis_key].strip() not in {"", "None", "N/A"}
                      and rows[0][disposition_key] == state["rls_applicability"],
                      "RLS_VFY_NOT_READY", "RLS applicability differs from frozen selected scope authority")
              if phase == "PLN":
                  basis = parse_reference_set(rows[0][basis_key])
                  inputs = set(parsed.front_matter.get("inputs", []))
                  require(bool(basis) and set(basis) <= inputs, "RLS_VFY_NOT_READY", "Aggregated applicability basis is outside selected scope inputs")
          '''
          p.write_text(s[:start]+replacement+s[end:])
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='76a1e8bff049203cce8bfa1bd9bc41846193ce1a155ca6b4f1d0e25787583ad8'
          t=Path('tests/skill_rls/test_selected_scope_applicability.py');assert not t.exists()
          t.write_text('''"""Canonical selected-scope applicability is independent of project/history."""
          from copy import deepcopy
          from dataclasses import replace
          from types import SimpleNamespace
          from unittest.mock import patch
          from tests.skill_rls.final_support import FinalRlsCase, read_vfy_candidate, snapshot
          from packages.sdlc_artifact_store import ArtifactStore
          from packages.sdlc_lifecycle.query_vfy import LifecycleQueryService
          from rls_vfy_adapter import _verify_applicability


          class SelectedScopeApplicabilityTests(FinalRlsCase):
              def test_actual_frozen_plan_aggregate_enters_release(self):
                  before = snapshot(self.root)
                  result = read_vfy_candidate(self.root, self.chain['vfy'])
                  self.assertEqual('required', result.rls_applicability)
                  self.assertTrue(result.authority_verified)
                  self.assertEqual(before, snapshot(self.root))

              def test_unselected_historical_nodes_cannot_create_ambiguity(self):
                  store = ArtifactStore.open_read_only(self.root)
                  projection = LifecycleQueryService(self.root).inspect_requirement(self.chain['requirement'])
                  polluted = SimpleNamespace(nodes=tuple(projection.nodes) * 3)
                  _verify_applicability(store, self.root, self.chain['state'], polluted)

              def changed_table(self, transform):
                  store = ArtifactStore.open_read_only(self.root)
                  identity, revision = self.chain['plan'].split('@')
                  selected = store.read_revision(identity, int(revision))
                  raw = selected.payload.primary_blob.decode()
                  changed = transform(raw)
                  self.assertNotEqual(raw, changed)
                  record = replace(selected, payload=replace(selected.payload, primary_blob=changed.encode()))
                  # Parser-level negative test, with frozen authority separately covered above.
                  with patch('rls_vfy_adapter._exact_authority', return_value=record):
                      self.code('RLS_VFY_NOT_READY', _verify_applicability, store, self.root,
                                self.chain['state'], SimpleNamespace(nodes=()))

              def test_missing_aggregate_cannot_fall_back_to_dsn(self):
                  self.changed_table(lambda raw: raw.replace('## 聚合适用性 Aggregated Applicability', '## Missing aggregate'))

              def test_wrong_table_shape_is_not_lifecycle_fallback(self):
                  self.changed_table(lambda raw: raw.replace('Effective Disposition', 'Disposition'))

              def test_duplicate_aggregate_is_rejected(self):
                  self.changed_table(lambda raw: raw + '\\n## 聚合适用性 Aggregated Applicability\\n')

              def test_self_reported_disposition_cannot_override_selected_scope(self):
                  store = ArtifactStore.open_read_only(self.root)
                  for value in ('n/a', 'pending', 'waived'):
                      with self.subTest(value=value):
                          state = deepcopy(self.chain['state']); state['rls_applicability'] = value
                          self.code('RLS_VFY_NOT_READY', _verify_applicability, store, self.root, state, SimpleNamespace(nodes=()))
          ''')
          assert hashlib.sha256(t.read_bytes()).hexdigest()=='664e1ed0b6d3c28ec23885ae75b05f60b420374a2ba30473e81d81a7b0b30f1b'
          Path('.github/workflows/rls-scope-once.yml').unlink()
          PY
      - name: Commit exact candidate before any qualification
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/realflow-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git add -- skills/sdlc-600-rls/scripts/rls_vfy_adapter.py tests/skill_rls/test_selected_scope_applicability.py .github/workflows/rls-scope-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rls): consume canonical applicability of exact selected scope' -m 'Retain historical revisions without ambiguity; reject missing scope tables rather than falling back. Refs ousui/test-sdlc#14.'
          git push origin HEAD:refs/heads/fix/realflow-closure-v1
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: materialize
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare supported containment without changing host policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rls-scope-evidence" "$RUNNER_TEMP/rls-scope-tools"
          if ! command -v bwrap >/dev/null; then
            cd "$RUNNER_TEMP/rls-scope-tools"
            apt-get download bubblewrap
            for p in bubblewrap_*.deb; do dpkg-deb -x "$p" extracted; done
            echo "$PWD/extracted/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Verify immutable source using strict actual-execution profile
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "$sha" > "$RUNNER_TEMP/rls-scope-evidence/source.sha"
          git bundle create "$RUNNER_TEMP/rls-scope-evidence/source.bundle" HEAD
          python3 -B tools/validate.py --profile strict --source-sha "$sha" --json-out "$RUNNER_TEMP/rls-scope-evidence/strict.json" 2>&1 | tee "$RUNNER_TEMP/rls-scope-evidence/strict.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rls-selected-scope-${{ github.run_id }}
          path: ${{ runner.temp }}/rls-scope-evidence/
          retention-days: 30
          if-no-files-found: error
